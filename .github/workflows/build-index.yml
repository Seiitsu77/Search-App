# Builds the Chroma index on a GitHub runner, scores it on queries with known
# answers against the index it replaces, and commits chromadb/ +
# data/anime_meta.json + data/evaluation.json back to the branch if search
# quality did not drop. Streamlit Community Cloud then redeploys from the commit.
name: Build search index

on:
  push:
    paths:
      - build_index.py
      - search_core.py
      - evaluate.py
      - requirements.txt
      - .github/workflows/build-index.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Unit tests
        run: pytest -q

      - name: Score the current index (baseline)
        run: |
          if [ -f chromadb/chroma.sqlite3 ]; then
            python evaluate.py --out "$RUNNER_TEMP/baseline.json"
          else
            echo "No committed index yet; skipping the baseline."
          fi

      - name: Chunk, embed and store in Chroma
        run: python build_index.py

      - name: Score the new index (fails if MRR@10 drops)
        run: python evaluate.py --out data/evaluation.json --baseline "$RUNNER_TEMP/baseline.json"

      - name: Score the new index without the query instruction (for comparison)
        run: python evaluate.py --query-prefix ""

      - name: Commit the index
        run: |
          # GitHub refuses files over 100 MB unless they are stored with Git LFS.
          big=$(find chromadb data -type f -size +95M)
          if [ -n "$big" ]; then
            echo "Tracking with Git LFS: $big"
            for f in $big; do git lfs track "$f"; done
            git add .gitattributes
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A chromadb data
          if git diff --cached --quiet; then
            echo "Index unchanged."
            exit 0
          fi
          git commit -m "Rebuild Chroma index (${GITHUB_SHA::7})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
