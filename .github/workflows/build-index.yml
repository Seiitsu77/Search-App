# Builds the Chroma index on a GitHub runner, checks it with real queries, and
# commits chromadb/ + data/anime_meta.json back to the branch. Streamlit
# Community Cloud then redeploys the app from the new commit.
name: Build search index

on:
  push:
    paths:
      - build_index.py
      - search_core.py
      - smoke_test.py
      - requirements.txt
      - .github/workflows/build-index.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Unit tests
        run: pytest -q

      - name: Chunk, embed and store in Chroma
        run: python build_index.py

      - name: Smoke test with real queries
        run: python smoke_test.py

      - name: Commit the index
        run: |
          # GitHub refuses files over 100 MB unless they are stored with Git LFS.
          big=$(find chromadb data -type f -size +95M)
          if [ -n "$big" ]; then
            echo "Tracking with Git LFS: $big"
            for f in $big; do git lfs track "$f"; done
            git add .gitattributes
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A chromadb data
          if git diff --cached --quiet; then
            echo "Index unchanged."
            exit 0
          fi
          git commit -m "Rebuild Chroma index (${GITHUB_SHA::7})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
